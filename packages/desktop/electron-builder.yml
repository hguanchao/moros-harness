appId: com.moros.harness
productName: Moros Harness
directories:
  output: dist-desktop
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
